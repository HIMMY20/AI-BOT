services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file: backend/.env
    ports: ["8000:8000"]
    volumes: ["./backend/data:/srv/data"]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
